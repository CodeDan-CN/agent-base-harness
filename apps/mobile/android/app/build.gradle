plugins { id 'com.android.application' }
android {
    namespace 'com.agentharness.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.agentharness.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    // Only the mobile bundle is packaged; never copy Server or Runtime resources.
    sourceSets { main { assets.srcDirs = ['../../../../dist/mobile'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
